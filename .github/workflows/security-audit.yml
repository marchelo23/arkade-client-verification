name: Security Audit & Stress Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 4 * * 1' # Run weekly on Mondays at 04:00 UTC

jobs:
  security-audit:
    name: Adversarial Blackbox & DoS Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Blackbox Security Adversarial Suite
        run: pnpm run test:sec

      - name: Run Extreme Stress & DoS Suite (1,000+ DAG Nodes)
        run: pnpm run test:stress

      - name: Run Full Audit CI Script
        run: pnpm run audit:ci
